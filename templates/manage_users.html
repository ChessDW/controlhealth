<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar usuarios · ControlHealth</title>
  <style>
    body{margin:0;min-height:100vh;background:#f5f7fa;color:#1c2b3a;font-family:Arial,sans-serif;padding:32px 18px}main{width:min(100%,620px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{color:#13855f;font-weight:bold;text-decoration:none}.card{background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0002}h1{margin-top:0}label{display:block;font-size:13px;font-weight:bold;margin:16px 0 7px}select,input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dfe8ee;border-radius:10px;font-size:15px}button{margin-top:24px;border:0;background:#19a97b;color:white;font-weight:bold;cursor:pointer}.message{padding:12px;border-radius:10px;margin:0 0 16px}.error{background:#fdeaea;color:#a52c2c}.success{background:#e6f7f1;color:#13855f}.hint{font-size:13px;color:#667784;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <div class="top"><strong>ControlHealth</strong><a class="back" href="{% url 'dashboard' %}">← Volver al panel</a></div>
    <section class="card">
      <h1>Administrar usuarios</h1>
      <p class="hint">Restablece la contraseña de una cuenta. Esta acción se aplica de inmediato.</p>
      {% if error_message %}<div class="message error" role="alert">{{ error_message }}</div>{% endif %}
      {% if success_message %}<div class="message success" role="status">{{ success_message }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <label for="user_id">Usuario / cédula</label>
        <select id="user_id" name="user_id" required>
          {% for account in users %}<option value="{{ account.pk }}">{{ account.username }}{% if account.is_superuser %} · administrador{% endif %}</option>{% endfor %}
        </select>
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" name="password" minlength="8" required autocomplete="new-password">
        <label for="password_confirmation">Confirmar contraseña</label>
        <input id="password_confirmation" type="password" name="password_confirmation" minlength="8" required autocomplete="new-password">
        <button type="submit">Actualizar contraseña</button>
      </form>
    </section>
  </main>
</body>
</html>
